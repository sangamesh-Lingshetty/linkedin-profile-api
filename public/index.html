<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>LinkedIn Profile API</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a66c2'/%3E%3Cpath fill='white' d='M8 13h4v12H8zm2-6a2.3 2.3 0 1 1 0 4.6A2.3 2.3 0 0 1 10 7zm6 6h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.7 4.8 6.1V25h-4v-6.2c0-1.5 0-3.4-2.1-3.4s-2.4 1.6-2.4 3.3V25h-4z'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #647084;
        --line: #d7dde8;
        --accent: #0a66c2;
        --accent-strong: #084f96;
        --code-bg: #0d1117;
        --code-text: #dbe7ff;
        --danger: #b42318;
        --ok: #057647;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11151c;
          --panel: #171c24;
          --text: #eef3fb;
          --muted: #a5b1c3;
          --line: #2b3340;
          --accent: #6ea8fe;
          --accent-strong: #9ac1ff;
          --code-bg: #080b10;
          --code-text: #d7e3f8;
          --danger: #ffb4a9;
          --ok: #7ee2a8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 36px;
      }

      .shell {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .hero {
        padding: 34px;
        border-bottom: 1px solid var(--line);
      }

      .mark {
        display: inline-grid;
        width: 42px;
        height: 42px;
        margin-bottom: 18px;
        border-radius: 8px;
        place-items: center;
        background: var(--accent);
        color: white;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 3.5rem;
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .tool {
        padding: 28px 34px 34px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        font-weight: 650;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 14px;
        background: transparent;
        color: var(--text);
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 78%);
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        padding: 0 18px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--accent-strong);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .status {
        color: var(--muted);
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--danger);
      }

      pre {
        min-height: 260px;
        max-height: 560px;
        margin: 0;
        overflow: auto;
        border-radius: 8px;
        padding: 18px;
        background: var(--code-bg);
        color: var(--code-text);
        font: 0.9rem/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 700px) {
        main {
          width: min(100% - 20px, 920px);
          padding-top: 18px;
        }

        .hero,
        .tool,
        footer {
          padding-inline: 18px;
        }

        .input-row {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }

        h1 {
          font-size: 2.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="title">
        <div class="hero">
          <div class="mark" aria-hidden="true">in</div>
          <h1 id="title">LinkedIn Profile API</h1>
          <p>Reverse-engineered LinkedIn profile extraction using direct HTTP, SDUI, and RSC endpoints. No browser automation.</p>
        </div>

        <div class="tool">
          <form id="profile-form">
            <label for="profile-url">LinkedIn Profile URL</label>
            <div class="input-row">
              <input
                id="profile-url"
                name="profileUrl"
                type="url"
                placeholder="https://www.linkedin.com/in/example/"
                autocomplete="off"
                required
              >
              <button id="submit-button" type="submit">Extract Profile</button>
            </div>
          </form>

          <div class="meta" aria-live="polite">
            <span id="status" class="status">Ready</span>
            <span id="duration"></span>
          </div>

          <pre id="output">{
  "message": "Enter a LinkedIn profile URL and run the API."
}</pre>
        </div>

        <footer>
          <span>Demo API. LinkedIn may rate-limit repeated requests.</span>
          <a href="/health">Health check</a>
        </footer>
      </section>
    </main>

    <script>
      const form = document.querySelector("#profile-form");
      const input = document.querySelector("#profile-url");
      const button = document.querySelector("#submit-button");
      const status = document.querySelector("#status");
      const duration = document.querySelector("#duration");
      const output = document.querySelector("#output");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const profileUrl = input.value.trim();
        if (!profileUrl) {
          return;
        }

        const startedAt = performance.now();
        button.disabled = true;
        status.className = "status";
        status.textContent = "Loading...";
        duration.textContent = "";
        output.textContent = "";

        try {
          const response = await fetch("/api/profile", {
            method: "POST",
            headers: {
              "content-type": "application/json"
            },
            body: JSON.stringify({ profileUrl })
          });
          const json = await response.json();
          const elapsed = Math.round(performance.now() - startedAt);

          status.className = response.ok ? "status ok" : "status error";
          status.textContent = `${response.status} ${response.statusText || ""}`.trim();
          duration.textContent = `${elapsed} ms`;
          output.textContent = JSON.stringify(json, null, 2);
        } catch (error) {
          const elapsed = Math.round(performance.now() - startedAt);

          status.className = "status error";
          status.textContent = "Request failed";
          duration.textContent = `${elapsed} ms`;
          output.textContent = JSON.stringify({
            error: {
              message: error.message || "Unable to call the API."
            }
          }, null, 2);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
